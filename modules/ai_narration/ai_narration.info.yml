name: 'AI Narration'
type: module
description: 'Generates downloadable spoken-audio narration through configured Drupal AI text-to-speech providers.'
package: 'AI'
lifecycle: experimental
core_version_requirement: ^10.3 || ^11
configure: ai_narration.settings
dependencies:
  - ai:ai
  - drupal:file
  - drupal:datetime
  - drupal:media
  - drupal:views
  - mcp_server:mcp_server
