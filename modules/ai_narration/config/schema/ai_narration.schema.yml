ai_narration.settings:
  type: config_object
  label: 'AI Narration settings'
  mapping:
    default_model:
      type: string
      label: 'Default text-to-speech provider and voice'
    player_mode:
      type: string
      label: 'Default audio player display mode'
    player_accent_colour:
      type: string
      label: 'Enhanced audio player accent colour'
    player_colour_mode:
      type: string
      label: 'Enhanced audio player colour mode'
    player_waveform_colour:
      type: string
      label: 'Enhanced audio player waveform colour'
    player_unplayed_waveform_colour:
      type: string
      label: 'Enhanced audio player unplayed waveform colour'
    player_background_colour:
      type: string
      label: 'Enhanced audio player background colour'
    player_text_colour:
      type: string
      label: 'Enhanced audio player text colour'
    player_height:
      type: string
      label: 'Enhanced audio player height'
    player_display_style:
      type: string
      label: 'Enhanced audio player display style'
