ai_narration.generate:
  path: '/admin/content/ai-narration'
  defaults:
    _form: '\Drupal\ai_narration\Form\NarrationGenerateForm'
    _title: 'AI Simple Narration'
  requirements:
    _permission: 'generate ai narration'

ai_narration.settings:
  path: '/admin/config/ai/narration'
  defaults:
    _form: '\Drupal\ai_narration\Form\NarrationSettingsForm'
    _title: 'AI Narration settings'
  requirements:
    _permission: 'administer ai narration'

ai_narration.voices:
  path: '/admin/content/ai-narration/voices'
  defaults:
    _form: '\Drupal\ai_narration\Form\NarrationVoicesForm'
    _title: 'Narration Voices'
  requirements:
    _permission: 'administer ai narration'

entity.ai_narration_project.collection:
  path: '/admin/content/ai-narration/projects'
  defaults:
    _entity_list: 'ai_narration_project'
    _title: 'Narration projects'
  requirements:
    _permission: 'administer ai narration'

entity.ai_narration_project.add_form:
  path: '/admin/content/ai-narration/projects/add'
  defaults:
    _entity_form: 'ai_narration_project.add'
    _title: 'Add narration project'
  requirements:
    _permission: 'administer ai narration'

entity.ai_narration_project.edit_form:
  path: '/admin/content/ai-narration/projects/{ai_narration_project}/edit'
  defaults:
    _entity_form: 'ai_narration_project.edit'
    _title: 'Edit narration project'
  requirements:
    _permission: 'administer ai narration'
  options:
    parameters:
      ai_narration_project:
        type: entity:ai_narration_project

entity.ai_narration_project.canonical:
  path: '/admin/content/ai-narration/projects/{ai_narration_project}'
  defaults:
    _entity_view: 'ai_narration_project.full'
    _title_callback: '\Drupal\Core\Entity\Controller\EntityController::title'
  requirements:
    _permission: 'administer ai narration'
  options:
    parameters:
      ai_narration_project:
        type: entity:ai_narration_project

entity.ai_narration_chapter.collection:
  path: '/admin/content/ai-narration/chapters'
  defaults:
    _entity_list: 'ai_narration_chapter'
    _title: 'Narration chapters'
  requirements:
    _permission: 'administer ai narration'

entity.ai_narration_chapter.add_form:
  path: '/admin/content/ai-narration/chapters/add'
  defaults:
    _entity_form: 'ai_narration_chapter.add'
    _title: 'Add narration chapter'
  requirements:
    _permission: 'administer ai narration'

entity.ai_narration_chapter.edit_form:
  path: '/admin/content/ai-narration/chapters/{ai_narration_chapter}/edit'
  defaults:
    _entity_form: 'ai_narration_chapter.edit'
    _title: 'Edit narration chapter'
  requirements:
    _permission: 'administer ai narration'
  options:
    parameters:
      ai_narration_chapter:
        type: entity:ai_narration_chapter

entity.ai_narration_chapter.canonical:
  path: '/admin/content/ai-narration/chapters/{ai_narration_chapter}'
  defaults:
    _entity_view: 'ai_narration_chapter.full'
    _title_callback: '\Drupal\Core\Entity\Controller\EntityController::title'
  requirements:
    _permission: 'administer ai narration'
  options:
    parameters:
      ai_narration_chapter:
        type: entity:ai_narration_chapter

entity.ai_narration_edition.collection:
  path: '/admin/content/ai-narration/editions'
  defaults: { _entity_list: 'ai_narration_edition', _title: 'Narration editions' }
  requirements: { _permission: 'administer ai narration' }
entity.ai_narration_edition.add_form:
  path: '/admin/content/ai-narration/editions/add'
  defaults: { _entity_form: 'ai_narration_edition.add', _title: 'Add narration edition' }
  requirements: { _permission: 'administer ai narration' }
entity.ai_narration_edition.edit_form:
  path: '/admin/content/ai-narration/editions/{ai_narration_edition}/edit'
  defaults: { _entity_form: 'ai_narration_edition.edit', _title: 'Edit narration edition' }
  requirements: { _permission: 'administer ai narration' }
  options: { parameters: { ai_narration_edition: { type: entity:ai_narration_edition } } }
entity.ai_narration_edition.canonical:
  path: '/admin/content/ai-narration/editions/{ai_narration_edition}'
  defaults: { _entity_view: 'ai_narration_edition.full', _title_callback: '\Drupal\Core\Entity\Controller\EntityController::title' }
  requirements: { _permission: 'administer ai narration' }
  options: { parameters: { ai_narration_edition: { type: entity:ai_narration_edition } } }

entity.ai_narration_promo.collection:
  path: '/admin/content/ai-narration/promos'
  defaults: { _entity_list: 'ai_narration_promo', _title: 'Narration promos' }
  requirements: { _permission: 'administer ai narration' }
entity.ai_narration_promo.add_form:
  path: '/admin/content/ai-narration/promos/add'
  defaults: { _entity_form: 'ai_narration_promo.add', _title: 'Add narration promo' }
  requirements: { _permission: 'administer ai narration' }
entity.ai_narration_promo.edit_form:
  path: '/admin/content/ai-narration/promos/{ai_narration_promo}/edit'
  defaults: { _entity_form: 'ai_narration_promo.edit', _title: 'Edit narration promo' }
  requirements: { _permission: 'administer ai narration' }
  options: { parameters: { ai_narration_promo: { type: entity:ai_narration_promo } } }
entity.ai_narration_promo.canonical:
  path: '/admin/content/ai-narration/promos/{ai_narration_promo}'
  defaults: { _entity_view: 'ai_narration_promo.full', _title_callback: '\Drupal\Core\Entity\Controller\EntityController::title' }
  requirements: { _permission: 'administer ai narration' }
  options: { parameters: { ai_narration_promo: { type: entity:ai_narration_promo } } }
