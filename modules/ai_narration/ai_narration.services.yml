services:
  logger.channel.ai_narration:
    parent: logger.channel_base
    arguments: ['ai_narration']

  ai_narration.generator:
    class: Drupal\ai_narration\Service\NarrationGenerator
    arguments: ['@ai.provider', '@file_system', '@file.repository', '@logger.channel.ai_narration']

  ai_narration.text_chunker:
    class: Drupal\ai_narration\Service\NarrationTextChunker

  ai_narration.media_publisher:
    class: Drupal\ai_narration\Service\NarrationMediaPublisher
    arguments: ['@entity_type.manager']

  ai_narration.duration_inspector:
    class: Drupal\ai_narration\Service\NarrationDurationInspector
    arguments: ['@file_system']
