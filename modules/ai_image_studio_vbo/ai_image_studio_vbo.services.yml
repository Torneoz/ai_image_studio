services:
  ai_image_studio_vbo.batch_manager:
    class: Drupal\ai_image_studio_vbo\Service\BulkGenerationManager
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@queue'
      - '@token'
      - '@datetime.time'

  ai_image_studio_vbo.generation_queue_subscriber:
    class: Drupal\ai_image_studio_vbo\EventSubscriber\BulkGenerationQueueSubscriber
    arguments:
      - '@ai_image_studio.queue_runner'
    tags:
      - { name: event_subscriber }
