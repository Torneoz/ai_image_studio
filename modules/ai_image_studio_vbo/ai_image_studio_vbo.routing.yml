ai_image_studio_vbo.jobs:
  path: '/admin/content/ai-image-studio/bulk'
  defaults:
    _controller: '\Drupal\ai_image_studio_vbo\Controller\BulkJobController::listing'
    _title: 'AI Image Studio bulk jobs'
  requirements:
    _permission: 'view ai image studio vbo jobs+view any ai image studio vbo job'

ai_image_studio_vbo.job:
  path: '/admin/content/ai-image-studio/bulk/{job_id}'
  defaults:
    _controller: '\Drupal\ai_image_studio_vbo\Controller\BulkJobController::view'
    _title_callback: '\Drupal\ai_image_studio_vbo\Controller\BulkJobController::title'
  requirements:
    _custom_access: '\Drupal\ai_image_studio_vbo\Controller\BulkJobController::access'
    job_id: '\d+'

ai_image_studio_vbo.regenerate:
  path: '/admin/content/ai-image-studio/bulk/{job_id}/item/{item_id}/regenerate'
  defaults:
    _form: '\Drupal\ai_image_studio_vbo\Form\RegenerateItemForm'
    _title: 'Regenerate bulk image'
  requirements:
    _custom_access: '\Drupal\ai_image_studio_vbo\Form\RegenerateItemForm::access'
    job_id: '\d+'
    item_id: '\d+'

ai_image_studio_vbo.regenerate_job:
  path: '/admin/content/ai-image-studio/bulk/{job_id}/regenerate'
  defaults:
    _form: '\Drupal\ai_image_studio_vbo\Form\RegenerateJobForm'
    _title: 'Regenerate bulk image job'
  requirements:
    _custom_access: '\Drupal\ai_image_studio_vbo\Form\RegenerateJobForm::access'
    job_id: '\d+'
