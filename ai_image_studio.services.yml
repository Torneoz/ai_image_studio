services:
  ai_image_studio.generator:
    class: Drupal\ai_image_studio\Service\ImageGenerator
    arguments:
      - '@ai.provider'
      - '@entity_type.manager'
      - '@file_system'
      - '@file.repository'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.ai_image_studio'
      - '@queue'
      - '@http_client'
      - '@key.repository'
      - '@?torneo_ai.pricing_catalog'

  logger.channel.ai_image_studio:
    parent: logger.channel_base
    arguments: ['ai_image_studio']

  ai_image_studio.compact_media_form:
    class: Drupal\ai_image_studio\Form\CompactMediaForm
    arguments:
      - '@ai_image_studio.generator'
      - '@entity_type.manager'
      - '@config.factory'
      - '@current_user'

  media_library.opener.ai_image_studio_form:
    class: Drupal\ai_image_studio\MediaLibraryFormOpener
    tags:
      - { name: media_library.opener }
