ai_image_studio.settings:
  type: config_object
  label: 'AI Image Studio settings'
  mapping:
    file_scheme:
      type: string
      label: 'File scheme'
    file_directory:
      type: string
      label: 'File directory'
    max_prompt_length:
      type: integer
      label: 'Maximum prompt length'
    max_turns:
      type: integer
      label: 'Maximum turns per session'
    default_history_order:
      type: string
      label: 'Default sort in Studio'
    generation_form_open:
      type: boolean
      label: 'Open the generation form initially'
    image_settings_open:
      type: boolean
      label: 'Open image settings initially'
    video_settings_open:
      type: boolean
      label: 'Open video settings initially'
    show_request_metadata:
      type: boolean
      label: 'Show request metadata'
    show_token_usage:
      type: boolean
      label: 'Show token usage'
    show_costs:
      type: boolean
      label: 'Show costs'
    show_session_report:
      type: boolean
      label: 'Show the session report'
    default_output_type:
      type: string
      label: 'Default output type'
    default_aspect_ratio:
      type: string
      label: 'Default aspect ratio'
    default_image_resolution:
      type: string
      label: 'Default image resolution'
    default_image_quality:
      type: string
      label: 'Default image quality'
    default_image_variations:
      type: integer
      label: 'Default number of image variations'
    default_video_resolution:
      type: string
      label: 'Default video resolution'
    default_video_duration:
      type: integer
      label: 'Default video duration'
    default_transparent_background:
      type: boolean
      label: 'Request transparent backgrounds by default'
    default_image_file_type:
      type: string
      label: 'Default image file type'
    default_auto_levels:
      type: boolean
      label: 'Apply auto levels by default'
    default_show_ai_badge:
      type: boolean
      label: 'Show an AI badge by default'
    default_ai_badge_text:
      type: string
      label: 'Default AI image badge text'
    default_video_ai_badge_text:
      type: string
      label: 'Default AI video badge text'
    default_text_to_image_model:
      type: string
      label: 'Default Text-to-Image model'
    default_image_to_image_model:
      type: string
      label: 'Default Image-to-Image model'
    default_text_to_video_model:
      type: string
      label: 'Default Text-to-Video model'
    default_image_to_video_model:
      type: string
      label: 'Default Image-to-Video model'
    max_source_image_size_mb:
      type: integer
      label: 'Maximum source image size in MB'
    max_video_duration:
      type: integer
      label: 'Maximum video duration'
    async_video_generation:
      type: boolean
      label: 'Queue video generation'
    generation_retry_limit:
      type: integer
      label: 'Generation retry limit'
    request_cost_warning:
      type: float
      label: 'Per-request cost warning threshold'
    session_cost_warning:
      type: float
      label: 'Session cost warning threshold'
    media_bundle:
      type: string
      label: 'Media bundle'
    media_source_field:
      type: string
      label: 'Media source field'
    require_image_alt:
      type: boolean
      label: 'Require image alternative text'
    video_media_bundle:
      type: string
      label: 'Video Media bundle'
    video_media_source_field:
      type: string
      label: 'Video Media source field'
